name: MusicFlow CI/CD Pipeline

on:
    tags: [ 'v*' ]
  # Дозволяє запускати збірку та реліз вручну через кнопку на GitHub
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Версія релізу (наприклад: v1.0.34)'
        required: true
        default: 'v1.0.34'
      build_number:
        description: 'Номер білда (наприклад: 35)'
        required: true
        default: '35'
      release_notes:
        description: 'Що нового в цій версії?'
        required: false
        default: 'Bug fixes and performance improvements.'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Run Static Code Analysis
        run: flutter analyze

      - name: 🧪 Run Automated Tests
        run: flutter test --coverage

  build-and-release:
    name: Build & Publish Release
    needs: quality-gate
    # Запускаємо якщо це пуш тегу, АБО якщо це ручний запуск (workflow_dispatch)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔐 Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat << EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/release.keystore
          EOF

      - name: 📝 Update pubspec.yaml (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          VERSION=${VERSION#v}
          BUILD="${{ github.event.inputs.build_number }}"
          sed -i -E "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION+$BUILD [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: 🔨 Compile APKs (Release & Debug)
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Якщо запуск ручний, компілюємо з вказаним build-name та build-number
            VERSION="${{ github.event.inputs.release_version }}"
            VERSION=${VERSION#v}
            flutter build apk --release --build-name=$VERSION --build-number=${{ github.event.inputs.build_number }}
            flutter build apk --debug --build-name=$VERSION --build-number=${{ github.event.inputs.build_number }}
          else
            # Звичайний білд для тегів
            flutter build apk --release
            flutter build apk --debug
          fi

      - name: 🔒 Calculate SHA-256 Checksum
        id: calc_sha
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum $APK_PATH | awk '{ print $1 }')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256: $SHA256"

      - name: 📝 Prepare Release Notes
        id: prep_notes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NOTES="${{ github.event.inputs.release_notes }}\n\n**SHA-256:** \`${{ env.SHA256 }}\`"
            TAG_NAME="${{ github.event.inputs.release_version }}"
            RELEASE_NAME="MusicFlow ${TAG_NAME} (build ${{ github.event.inputs.build_number }})"
          else
            NOTES="Оновлення з GitHub Releases.\n\n**SHA-256:** \`${{ env.SHA256 }}\`"
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="MusicFlow ${{ github.ref_name }}"
          fi
          
          # Екранування для багаторядкового виводу в GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          generate_release_notes: false
