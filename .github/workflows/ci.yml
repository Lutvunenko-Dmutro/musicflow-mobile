name: MusicFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  quality-gate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: 📦 Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Run Static Code Analysis
        run: flutter analyze

      - name: 🧪 Run Automated Tests
        run: flutter test --coverage

  build-and-release:
    name: Build & Publish Release
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: 📦 Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔐 Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat << EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/release.keystore
          EOF

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🚀 Setup Node.js (for Semantic Release)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: 🔨 Install Semantic Release
        run: npm ci

      - name: 🎯 Run Semantic Release & Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Запускаємо semantic-release у режимі "сухого прогону" (dry-run)
          # щоб дізнатися, яку версію він згенерує, але нічого не публікуємо.
          export NEXT_VERSION=$(npx semantic-release --dry-run | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          
          if [ -z "$NEXT_VERSION" ]; then
            echo "Немає нових 'feat' або 'fix' комітів. Оновлення не потрібне."
            exit 0
          fi
          
          echo "Semantic Release вирахував нову версію: $NEXT_VERSION"
          BUILD_NUM=${{ github.run_number }}
          
          # 2. Збираємо APK з цією версією
          echo "Building Release APK: Version $NEXT_VERSION, Build $BUILD_NUM"
          flutter build apk --release --build-name=$NEXT_VERSION --build-number=$BUILD_NUM
          
          echo "Building Debug APK: Version $NEXT_VERSION, Build $BUILD_NUM"
          flutter build apk --debug --build-name=$NEXT_VERSION --build-number=$BUILD_NUM
          
          # 3. Рахуємо SHA-256 (чисто для логів пайплайну)
          SHA256_REL=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{ print $1 }')
          SHA256_DBG=$(sha256sum build/app/outputs/flutter-apk/app-debug.apk | awk '{ print $1 }')
          echo "Release SHA-256: $SHA256_REL"
          echo "Debug SHA-256: $SHA256_DBG"
          
          # 4. Справжній запуск Semantic Release
          npx semantic-release
